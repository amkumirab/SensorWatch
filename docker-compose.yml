services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sensorwatch}
      POSTGRES_USER: ${POSTGRES_USER:-sensorwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensorwatch-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  sensorwatch:
    build: .
    ports:
      - "8000:8000"
    environment:
      SENSORWATCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sensorwatch}:${POSTGRES_PASSWORD:-sensorwatch-dev}@postgres:5432/${POSTGRES_DB:-sensorwatch}
      SENSORWATCH_DEMO_ENABLED: "true"
      SENSORWATCH_INGEST_API_KEY: ${SENSORWATCH_INGEST_API_KEY:-}
      SENSORWATCH_STALE_AFTER_SECONDS: ${SENSORWATCH_STALE_AFTER_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  monitor:
    build: .
    command: ["sensorwatch", "monitor", "--interval", "${SENSORWATCH_MONITOR_INTERVAL:-15}"]
    environment:
      SENSORWATCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sensorwatch}:${POSTGRES_PASSWORD:-sensorwatch-dev}@postgres:5432/${POSTGRES_DB:-sensorwatch}
      SENSORWATCH_STALE_AFTER_SECONDS: ${SENSORWATCH_STALE_AFTER_SECONDS:-300}
    depends_on:
      sensorwatch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
